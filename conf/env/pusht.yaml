name: pusht
args: []
kwargs: 
  with_velocity: true
  with_target: true

dataset:
  _target_: "datasets.pusht_dset.load_pusht_slice_train_val"
  with_velocity: true
  n_rollout: null
  include_previous_frames: false
  video_reader_cache_size: 0  # per DataLoader worker; 0 preserves the original behavior
  video_frame_cache_size: 0  # raw decoded frames per worker; 0 disables caching
  merge_video_reads: false  # decode current and previous frames in one get_batch call
  window_block_size: 1  # 1 preserves global window shuffle; >1 groups nearby windows
  normalize_action: ${normalize_action}
  data_path: ${oc.env:DATASET_DIR}/pusht_noise
  split_ratio: 0.9
  transform:
    _target_: "datasets.img_transforms.default_transform"
    img_size: ${img_size}

decoder_path: null
num_workers: 16
