# @package _global_
# Predictor-only control; all other settings shared with gradient_j.
training:
  gradient_mode: predictor_only
  stop_grad: true
  encoder_eval_mode: true
  straighten: false
  vcreg: false
  save_every_x_iterations: 0
  save_every_x_epoch: 1
  initial_checkpoint: null
  save_frozen_encoder: true
model:
  train_encoder: false
  train_predictor: true
  train_decoder: false
has_decoder: false
